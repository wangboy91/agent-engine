models:
  # Change this to mimo_anthropic to use the Anthropic-compatible endpoint.
  active_profile: mimo

  profiles:
    mimo:
      protocol: openai-compatible
      base_url: ${OPENAI_COMPATIBLE_BASE_URL}
      api_key_env: OPENAI_AUTH_TOKEN
      model: ${OPENAI_MODEL}
      timeout_seconds: 180
      max_tokens: 16000

    mimo_anthropic:
      protocol: anthropic
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
      model: ${ANTHROPIC_MODEL}
      timeout_seconds: 180
      max_tokens: 16000
