<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Engine 运行控制台</title>
    <link rel="stylesheet" href="/ui/assets/runtime-console.css?v=9" />
  </head>
  <body>
    <main class="console-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Agent Engine</p>
          <h1>运行控制台</h1>
        </div>
        <nav class="app-nav" aria-label="主菜单">
          <button id="configMenu" class="nav-button active" type="button">配置</button>
          <button id="runMenu" class="nav-button" type="button">运行</button>
        </nav>
        <span id="healthStatus" class="status-pill">检查中</span>
      </header>

      <section id="configPage" class="page active" aria-label="配置">
        <div class="config-grid">
          <section class="workspace-panel" aria-label="工作区">
            <header class="panel-header">
              <div>
                <p class="eyebrow">Workspace</p>
                <h2>工作区与身份</h2>
              </div>
            </header>

            <div class="field-grid">
              <label>
                工作区
                <input id="workspaceId" value="default_workspace" autocomplete="off" />
              </label>
              <label>
                身份
                <input id="identityId" value="default_operator" autocomplete="off" />
              </label>
            </div>
            <div class="field-grid">
              <label>
                工作区名称
                <input id="workspaceName" value="默认工作区" autocomplete="off" />
              </label>
              <label>
                身份名称
                <input id="identityName" value="运营助手" autocomplete="off" />
              </label>
            </div>
            <div class="button-row">
              <button id="ensureWorkspace" type="button">创建 / 确保</button>
              <button id="refreshState" type="button">刷新</button>
            </div>
            <div class="workspace-note">
              当前工作区状态文件：<code>.agent/workspaces.json</code><br />
              运行产物目录：<code>data/artifacts/</code>
            </div>
          </section>

          <section class="registry-panel" aria-label="技能注册">
            <div class="section-title">
              <div>
                <p class="eyebrow">Catalog</p>
                <h2>技能与工具注册</h2>
              </div>
              <span id="registeredCount">0 个技能</span>
            </div>
            <div class="field-grid">
              <label>
                技能目录
                <input id="skillsDir" value="resources/skills" autocomplete="off" />
              </label>
              <label>
                工具目录
                <input id="toolsDir" value="resources/tools" autocomplete="off" />
              </label>
            </div>
            <button id="scanWorkspaceSkills" class="wide-button" type="button">
              扫描并安装到工作区
            </button>
            <div class="field-row">
              <input id="packagePath" value="resources/skills/talking-video" autocomplete="off" />
              <button id="registerSkill" type="button">注册到身份</button>
            </div>
            <div class="field-row">
              <input
                id="toolPackagePath"
                value="resources/tools/subtitle_generate_srt"
                autocomplete="off"
              />
              <button id="registerTool" type="button">工具给身份</button>
            </div>
            <div class="button-row">
              <button id="registerResources" type="button">资源技能给身份</button>
              <button id="registerTools" type="button">资源工具给身份</button>
            </div>
            <div id="registeredSkills" class="skill-list" aria-live="polite"></div>
          </section>
        </div>
      </section>

      <section id="runPage" class="page" aria-label="运行">
        <section class="chat-panel" aria-label="对话">
          <header class="chat-header">
            <div>
              <p class="eyebrow">Session</p>
              <h2>对话执行</h2>
            </div>
            <div class="chat-controls">
              <label class="toggle-row">
                <input id="deepThinkingToggle" type="checkbox" checked />
                深度思考
              </label>
              <select id="skillSelect" aria-label="技能"></select>
            </div>
          </header>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="chatForm" class="composer">
            <textarea
              id="messageInput"
              rows="3"
              spellcheck="false"
            >介绍openspec</textarea>
            <div class="composer-actions">
              <label>
                会话
                <input id="sessionId" value="sess_runtime_console" autocomplete="off" />
              </label>
              <button type="submit">运行</button>
            </div>
          </form>
        </section>

        <section class="observe-panel" aria-label="执行观察">
          <div class="section-title">
            <h2>执行过程</h2>
            <button id="clearEvents" type="button">清空</button>
          </div>
          <ol id="eventList" class="event-list" aria-live="polite"></ol>

          <div class="section-title output-title">
            <h2>输出</h2>
            <span id="runStatus">空闲</span>
          </div>
          <pre id="outputView" class="output-view">{}</pre>

          <div class="section-title artifact-title">
            <h2>产物</h2>
            <button id="loadArtifacts" type="button">加载</button>
          </div>
          <div id="artifactList" class="artifact-list"></div>
        </section>
      </section>
    </main>

    <script src="/ui/assets/runtime-console.js?v=9" defer></script>
  </body>
</html>
